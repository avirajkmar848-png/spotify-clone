<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <title>Spotify-Web player:Music for everyone</title>
</head>
<body>
    <div class="container flex bg-black">
    <div class="left  ">
        <div class="close">
            <img class="invert" src="Images/close.svg" alt="" >
        </div>
        <div class="home bg-grey rounded m-1  p-1" >
            <div class="logo "><img width="50" class=invert src="Images/spotify.svg" alt="">Spotify</div>
            <ul>
                <li><img class=invert src="Images/home.svg" alt="home">Home</li>
                <li><img class=invert src="Images/search.svg" alt="search">Search</li>
            </ul>
        </div>
        <div class="library bg-grey rounded m-1 p-1">
            <div class="heading">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><rect width="100%" height="100%" fill="black"/><path fill="white" d="M14.5 2.134a1 1 0 0 1 1 0l6 3.464a1 1 0 0 1 .5.866V21a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1V3a1 1 0 0 1 .5-.866M16 4.732V20h4V7.041zM3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1m6 0a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1"/></svg>
           <h2>Your library</h2>
        </div>
        <div class="songlist">
        <ul>
           
           </ul>
           </div>
    </div>
    <div class="footer">
      <div><a href="https://www.spotify.com/in-en/legal/"><span>Legal</span> </a></div>
      <div><a href="https://www.spotify.com/in-en/safetyandprivacy/"> <span>Safety & Privacy Center</span> </a></div>
      <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/"> <span>Privacy Policy</span></a></div>
      <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/"><span>Cookies</span> </a></div>
      <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
      <div><a href="https://www.spotify.com/in-en/accessibility/"><span>Accessibility</span></a></div>
  </div>
    </div>
    <div class="right bg-grey rounded p-1">
        <div class="header">
            <div class="nav">
                <div class="hamburgercont">
                    <img class="invert hamburger" src="Images/hamburger.svg" alt="">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="20" height="30" viewBox="0 0 7 16" style="color:fffff;"><path fill="currentColor" d="M5.5 13a.47.47 0 0 1-.35-.15l-4.5-4.5c-.2-.2-.2-.51 0-.71l4.5-4.49c.2-.2.51-.2.71 0s.2.51 0 .71L1.71 8l4.15 4.15c.2.2.2.51 0 .71c-.1.1-.23.15-.35.15Z"></path></svg>
               <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="20" height="30" viewBox="0 0 7 16" style="color:fffff;"><path fill="currentColor" d="M1.5 13a.47.47 0 0 1-.35-.15c-.2-.2-.2-.51 0-.71L5.3 7.99L1.15 3.85c-.2-.2-.2-.51 0-.71s.51-.2.71 0l4.49 4.51c.2.2.2.51 0 .71l-4.5 4.49c-.1.1-.23.15-.35.15"></path></svg>
            </div>
                </div>
              <div class="buttons">
    <button class="signupbtn">
        Sign up
    </button>

    <button class="loginbtn">
        Log in
    </button>
</div>
    </div>
    <div class="SpotifyPlaylists">
        <h1>Spotify Playlists</h1>
        <div class="cardcontainer">
          
            </div>
            <div class="playbar">
                <div class="seekbar">
                    <div class="circle">
                        
                    </div>
                </div>
                <div class="abovebar">

                <div class="songinfo"></div>
                <div class="songbuttons">
                    <svg id="previous" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="30" height="30" viewBox="0 0 2048 2048" style="color:  rgb(22,22,22);"><path fill="currentColor" d="M256 1792V256h128v1536zm448-768l1088-768v1536zm960 521V503l-738 521z"></path></svg>
                    <img id="play" src="Images/play.svg">
                    <svg id="next" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="30" height="30" viewBox="0 0 2048 2048" style="color: rgb(22,22,22);"><path fill="currentColor" d="M1664 256h128v1536h-128zM256 1792V256l1088 768zM384 503v1042l738-521z"></path></svg>
                </div>
                <div class="timevol">
                <div class="songtime">
                    
                </div>
                <div class="volume">
                    <img src="Images/volume.svg" alt="">
                    <div class="range">
                        <input  width="25" type="range" name="volume" id="">
                    </div>
                </div>
                </div>
                </div>
            </div>
            
        </div>
    </div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
